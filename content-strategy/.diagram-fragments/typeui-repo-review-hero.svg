<svg viewBox="0 0 960 600" role="img" aria-labelledby="typeui-repo-review-hero-title typeui-repo-review-hero-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="typeui-repo-review-hero-title">Design constraints as readable context</title>
  <desc id="typeui-repo-review-hero-desc">Generic agent-generated interface output passes through version-controlled typography, spacing, color, and interaction constraints to produce a coherent interface.</desc>
  <defs>
    <marker id="typeui-repo-review-hero-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="typeui-repo-review-hero-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A5523D"/>
    </marker>
    <marker id="typeui-repo-review-hero-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8A4433"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F5EFE6"/>

  <path d="M280 288 H360" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#typeui-repo-review-hero-arrow)"/>
  <rect x="292" y="264" width="56" height="16" rx="4" fill="#F5EFE6"/>
  <text x="320" y="276" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASSES TO</text>
  <path d="M600 288 H680" fill="none" stroke="#374151" stroke-width="1" marker-end="url(#typeui-repo-review-hero-arrow)"/>
  <rect x="612" y="264" width="56" height="16" rx="4" fill="#F5EFE6"/>
  <text x="640" y="276" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRODUCES</text>

  <rect x="80" y="240" width="200" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="80" y="240" width="200" height="96" rx="6" fill="rgba(55,65,81,0.10)" stroke="#6B7280" stroke-width="1"/>
  <text x="180" y="284" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Generic agent output</text>
  <text x="180" y="304" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">UNSTRUCTURED INPUT</text>

  <rect x="360" y="144" width="240" height="288" rx="6" fill="#F5EFE6"/>
  <rect x="360" y="144" width="240" height="288" rx="6" fill="rgba(192,97,74,0.10)" stroke="#A5523D" stroke-width="1"/>
  <text x="480" y="172" fill="#A5523D" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERSION-CONTROLLED</text>
  <text x="480" y="204" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Constraint set</text>
  <line x1="384" y1="224" x2="576" y2="224" stroke="#D6C9B6" stroke-width="0.8"/>
  <text x="480" y="252" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TYPOGRAPHY</text>
  <line x1="384" y1="268" x2="576" y2="268" stroke="#D6C9B6" stroke-width="0.8"/>
  <text x="480" y="296" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SPACING</text>
  <line x1="384" y1="312" x2="576" y2="312" stroke="#D6C9B6" stroke-width="0.8"/>
  <text x="480" y="340" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">COLOR</text>
  <line x1="384" y1="356" x2="576" y2="356" stroke="#D6C9B6" stroke-width="0.8"/>
  <text x="480" y="384" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INTERACTION STATES</text>

  <rect x="680" y="240" width="200" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="680" y="240" width="200" height="96" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="780" y="284" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Coherent interface</text>
  <text x="780" y="304" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STRUCTURED OUTPUT</text>
</svg>
