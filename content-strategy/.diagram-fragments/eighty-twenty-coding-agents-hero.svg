<svg viewBox="0 0 960 600" role="img" aria-labelledby="eighty-twenty-coding-agents-hero-title eighty-twenty-coding-agents-hero-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="eighty-twenty-coding-agents-hero-title">Four constraints, one anti-pattern</title>
  <desc id="eighty-twenty-coding-agents-hero-desc">Four lightweight architectural practices account for most of the reliability gain in coding agents, replacing a long monolithic system prompt shown as the pattern to delete.</desc>
  <defs>
    <marker id="eighty-twenty-coding-agents-hero-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="eighty-twenty-coding-agents-hero-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A5523D"/>
    </marker>
    <marker id="eighty-twenty-coding-agents-hero-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8A4433"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F5EFE6"/>

  <line x1="480" y1="160" x2="480" y2="280" stroke="#374151" stroke-width="1"/>
  <line x1="168" y1="280" x2="792" y2="280" stroke="#374151" stroke-width="1"/>
  <line x1="168" y1="280" x2="168" y2="360" stroke="#374151" stroke-width="1" marker-end="url(#eighty-twenty-coding-agents-hero-arrow)"/>
  <line x1="376" y1="280" x2="376" y2="360" stroke="#374151" stroke-width="1" marker-end="url(#eighty-twenty-coding-agents-hero-arrow)"/>
  <line x1="584" y1="280" x2="584" y2="360" stroke="#374151" stroke-width="1" marker-end="url(#eighty-twenty-coding-agents-hero-arrow)"/>
  <line x1="792" y1="280" x2="792" y2="360" stroke="#374151" stroke-width="1" marker-end="url(#eighty-twenty-coding-agents-hero-arrow)"/>

  <rect x="360" y="96" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="360" y="96" width="240" height="64" rx="6" fill="rgba(192,97,74,0.10)" stroke="#A5523D" stroke-width="1.2"/>
  <text x="480" y="132" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">80% of agentic reliability</text>

  <rect x="88" y="360" width="160" height="56" rx="6" fill="#F5EFE6"/>
  <rect x="88" y="360" width="160" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
  <text x="168" y="392" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Low-fidelity alignment</text>

  <rect x="296" y="360" width="160" height="56" rx="6" fill="#F5EFE6"/>
  <rect x="296" y="360" width="160" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
  <text x="376" y="392" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Context-sized tickets</text>

  <rect x="504" y="360" width="160" height="56" rx="6" fill="#F5EFE6"/>
  <rect x="504" y="360" width="160" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
  <text x="584" y="392" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Deterministic resets</text>

  <rect x="712" y="360" width="160" height="56" rx="6" fill="#F5EFE6"/>
  <rect x="712" y="360" width="160" height="56" rx="6" fill="#ffffff" stroke="#111827" stroke-width="0.8"/>
  <text x="792" y="392" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Prompt pruning</text>

  <rect x="360" y="488" width="240" height="56" rx="6" fill="#F5EFE6"/>
  <rect x="360" y="488" width="240" height="56" rx="6" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="452" y="496" width="56" height="16" rx="4" fill="#F5EFE6" stroke="rgba(17,24,39,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="480" y="508" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DELETE</text>
  <text x="480" y="532" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">500-line system prompt</text>
