<svg viewBox="0 0 960 600" role="img" aria-labelledby="code-over-willpower-boundary-title code-over-willpower-boundary-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="code-over-willpower-boundary-title">Where judgment ends and enforcement begins</title>
  <desc id="code-over-willpower-boundary-desc">Two lanes separate work requiring agent judgment from work a deterministic check can settle, with an arrow showing a repeated judgment being encoded as a check and crossing the boundary.</desc>
  <defs>
    <marker id="code-over-willpower-boundary-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#374151"/>
    </marker>
    <marker id="code-over-willpower-boundary-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#A5523D"/>
    </marker>
    <marker id="code-over-willpower-boundary-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#8A4433"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F5EFE6"/>

  <rect x="64" y="80" width="832" height="456" rx="8" fill="none" stroke="#D6C9B6" stroke-width="1"/>
  <line x1="480" y1="80" x2="480" y2="536" stroke="#D6C9B6" stroke-width="1"/>
  <line x1="64" y1="152" x2="896" y2="152" stroke="#D6C9B6" stroke-width="1"/>
  <text x="272" y="124" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Agent judgment</text>
  <text x="688" y="124" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Deterministic checks</text>

  <line x1="384" y1="440" x2="576" y2="440" stroke="#A5523D" stroke-width="1.2" marker-end="url(#code-over-willpower-boundary-arrow-accent)"/>
  <rect x="392" y="416" width="176" height="16" rx="4" fill="#F5EFE6"/>
  <text x="480" y="428" fill="#A5523D" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ENCODED AS A CHECK</text>

  <rect x="144" y="184" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="144" y="184" width="240" height="64" rx="6" fill="rgba(55,65,81,0.10)" stroke="#6B7280" stroke-width="1"/>
  <text x="264" y="220" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Resolve ambiguity</text>

  <rect x="144" y="296" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="144" y="296" width="240" height="64" rx="6" fill="rgba(55,65,81,0.10)" stroke="#6B7280" stroke-width="1"/>
  <text x="264" y="332" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Weigh tradeoffs</text>

  <rect x="144" y="408" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="144" y="408" width="240" height="64" rx="6" fill="rgba(55,65,81,0.10)" stroke="#6B7280" stroke-width="1"/>
  <text x="264" y="436" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Judge whether a source</text>
  <text x="264" y="452" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">supports a claim</text>

  <rect x="576" y="184" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="576" y="184" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="696" y="212" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Compiles and</text>
  <text x="696" y="228" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">passes tests</text>

  <rect x="576" y="296" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="576" y="296" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="696" y="332" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Required fields present</text>

  <rect x="576" y="408" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="576" y="408" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="696" y="436" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Schema and allowed</text>
  <text x="696" y="452" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">values enforced</text>
</svg>
