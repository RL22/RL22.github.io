<svg viewBox="0 0 960 600" role="img" aria-labelledby="code-over-willpower-ci-loop-title code-over-willpower-ci-loop-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="code-over-willpower-ci-loop-title">Verification as a merge contract</title>
  <desc id="code-over-willpower-ci-loop-desc">An agent change runs required status checks; a failure returns specific, bounded feedback for revision, and only a passing change reaches a protected merge.</desc>
  <defs>
    <marker id="code-over-willpower-ci-loop-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#374151"/>
    </marker>
    <marker id="code-over-willpower-ci-loop-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#A5523D"/>
    </marker>
    <marker id="code-over-willpower-ci-loop-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#8A4433"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#F5EFE6"/>

  <line x1="480" y1="104" x2="480" y2="144" stroke="#374151" stroke-width="1.2" marker-end="url(#code-over-willpower-ci-loop-arrow)"/>
  <line x1="480" y1="208" x2="480" y2="240" stroke="#374151" stroke-width="1.2" marker-end="url(#code-over-willpower-ci-loop-arrow)"/>
  <line x1="560" y1="288" x2="664" y2="288" stroke="#374151" stroke-width="1.2" marker-end="url(#code-over-willpower-ci-loop-arrow)"/>
  <rect x="584" y="264" width="56" height="16" rx="4" fill="#F5EFE6"/>
  <text x="612" y="276" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>
  <line x1="480" y1="336" x2="480" y2="400" stroke="#374151" stroke-width="1.2" marker-end="url(#code-over-willpower-ci-loop-arrow)"/>
  <rect x="488" y="356" width="48" height="16" rx="4" fill="#F5EFE6"/>
  <text x="512" y="368" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>
  <path d="M 360 440 H 168 Q 160 440 160 432 V 80 Q 160 72 168 72 H 380" fill="none" stroke="#374151" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#code-over-willpower-ci-loop-arrow)"/>
  <rect x="168" y="244" width="64" height="16" rx="4" fill="#F5EFE6"/>
  <text x="200" y="256" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REVISE</text>

  <rect x="380" y="40" width="200" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="380" y="40" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="480" y="76" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Agent change</text>

  <rect x="360" y="144" width="240" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="360" y="144" width="240" height="64" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="480" y="180" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Required status check</text>

  <polygon points="480 240, 560 288, 480 336, 400 288" fill="#F5EFE6"/>
  <polygon points="480 240, 560 288, 480 336, 400 288" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="480" y="292" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Checks pass?</text>

  <rect x="360" y="400" width="240" height="80" rx="6" fill="#F5EFE6"/>
  <rect x="360" y="400" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1"/>
  <text x="480" y="432" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Specific failure feedback</text>
  <text x="480" y="452" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">category must be one of four values</text>

  <rect x="664" y="256" width="200" height="64" rx="6" fill="#F5EFE6"/>
  <rect x="664" y="256" width="200" height="64" rx="6" fill="rgba(165,82,61,0.05)" stroke="rgba(165,82,61,0.50)" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="764" y="292" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Protected merge</text>
</svg>
