<svg viewBox="0 0 960 600" role="img" aria-labelledby="agnostic-ai-stack-routing-title agnostic-ai-stack-routing-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="agnostic-ai-stack-routing-title">Provider-agnostic model routing</title>
  <desc id="agnostic-ai-stack-routing-desc">A workflow sends a task type to a routing table, which selects an evaluated model tier and calls it through a provider adapter that can reach more than one provider.</desc>
  <defs>
    <marker id="agnostic-ai-stack-routing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="agnostic-ai-stack-routing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A5523D"/>
    </marker>
    <marker id="agnostic-ai-stack-routing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8A4433"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F5EFE6"/>

  <line x1="160" y1="300" x2="200" y2="300" stroke="#374151" stroke-width="1.2" marker-end="url(#agnostic-ai-stack-routing-arrow)"/>
  <rect x="164" y="280" width="32" height="12" rx="4" fill="#F5EFE6"/>
  <text x="180" y="288" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TASK</text>

  <line x1="360" y1="300" x2="400" y2="300" stroke="#374151" stroke-width="1.2" marker-end="url(#agnostic-ai-stack-routing-arrow)"/>
  <rect x="360" y="280" width="40" height="12" rx="4" fill="#F5EFE6"/>
  <text x="380" y="288" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOOKUP</text>

  <line x1="544" y1="300" x2="584" y2="300" stroke="#374151" stroke-width="1.2" marker-end="url(#agnostic-ai-stack-routing-arrow)"/>
  <rect x="548" y="280" width="32" height="12" rx="4" fill="#F5EFE6"/>
  <text x="564" y="288" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ADAPT</text>

  <path d="M 728 284 H 744 Q 752 284 752 276 V 216 Q 752 208 760 208 H 784" fill="none" stroke="#8A4433" stroke-width="1.2" marker-end="url(#agnostic-ai-stack-routing-arrow-link)"/>
  <rect x="704" y="232" width="40" height="12" rx="4" fill="#F5EFE6"/>
  <text x="724" y="240" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRIMARY</text>

  <path d="M 728 316 H 744 Q 752 316 752 324 V 384 Q 752 392 760 392 H 784" fill="none" stroke="#8A4433" stroke-width="1.2" marker-end="url(#agnostic-ai-stack-routing-arrow-link)"/>
  <rect x="704" y="356" width="40" height="12" rx="4" fill="#F5EFE6"/>
  <text x="724" y="364" fill="#6B7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPTION</text>

  <rect x="40" y="252" width="120" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="40" y="252" width="120" height="96" rx="6" fill="rgba(55,65,81,0.10)" stroke="#6B7280" stroke-width="1"/>
  <text x="100" y="304" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Workflow</text>

  <rect x="200" y="212" width="160" height="176" rx="6" fill="#F5EFE6"/>
  <rect x="200" y="212" width="160" height="176" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="280" y="252" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Task type</text>
  <text x="280" y="280" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">classification</text>
  <text x="280" y="304" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">planning</text>
  <text x="280" y="328" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">code editing</text>
  <text x="280" y="352" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">release review</text>

  <rect x="400" y="252" width="144" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="400" y="252" width="144" height="96" rx="6" fill="rgba(192,97,74,0.10)" stroke="#A5523D" stroke-width="1.2"/>
  <text x="472" y="292" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Routing table</text>
  <text x="472" y="316" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">evaluated model tier</text>

  <rect x="584" y="252" width="144" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="584" y="252" width="144" height="96" rx="6" fill="#ffffff" stroke="#111827" stroke-width="1"/>
  <text x="656" y="292" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Provider adapter</text>
  <text x="656" y="316" fill="#374151" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stable interface</text>

  <rect x="784" y="160" width="144" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="784" y="160" width="144" height="96" rx="6" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
  <text x="856" y="212" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Provider A</text>

  <rect x="784" y="344" width="144" height="96" rx="6" fill="#F5EFE6"/>
  <rect x="784" y="344" width="144" height="96" rx="6" fill="rgba(17,24,39,0.03)" stroke="rgba(17,24,39,0.30)" stroke-width="1"/>
  <text x="856" y="396" fill="#111827" font-size="12" font-weight="600" font-family="'Figtree', sans-serif" text-anchor="middle">Provider B</text>
</svg>
