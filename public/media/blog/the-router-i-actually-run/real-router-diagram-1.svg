<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 936" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="real-router-diagram-1-title real-router-diagram-1-desc">
        <title id="real-router-diagram-1-title">One call, one route.</title>
        <desc id="real-router-diagram-1-desc">Flowchart showing how delegate.sh uses a pinned routing table and a self-delegation guard to choose an executor and model, rerouting when necessary before invoking a sandboxed command.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=Figtree:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="real-router-diagram-1-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#374151"/>
          </marker>
          <marker id="real-router-diagram-1-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#A5523D"/>
          </marker>
          <marker id="real-router-diagram-1-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#8A4433"/>
          </marker>
        </defs>

        <rect width="800" height="936" fill="#F5EFE6"/>

        <!-- Connectors are drawn first so every node remains visually intact. -->
        <g fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#real-router-diagram-1-arrow)">
          <path d="M400 104 V144"/>
          <path d="M400 240 V288"/>
          <path d="M400 464 V608"/>
          <path d="M560 376 H608" stroke="#6B7280" stroke-dasharray="4 4"/>
          <path d="M696 440 V608 Q696 616 688 616 H408" stroke="#6B7280" stroke-dasharray="4 4"/>
          <path d="M400 620 V664"/>
        </g>
        <path d="M400 760 V816" fill="none" stroke="#A5523D" stroke-width="1.2" marker-end="url(#real-router-diagram-1-arrow-accent)"/>

        <!-- Decision labels sit in open canvas with an 8px connector gap. -->
        <g font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.08em">
          <rect x="408" y="520" width="32" height="16" rx="4" fill="#F5EFE6"/>
          <text x="424" y="532" fill="#374151" text-anchor="middle">NO</text>
          <rect x="568" y="352" width="32" height="16" rx="4" fill="#F5EFE6"/>
          <text x="584" y="364" fill="#6B7280" text-anchor="middle">YES</text>
        </g>

        <!-- Start -->
        <ellipse cx="400" cy="72" rx="120" ry="32" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <text x="400" y="76" fill="#111827" font-family="'Figtree', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">delegate --task &lt;type&gt;</text>

        <!-- Routing table lookup -->
        <rect x="240" y="144" width="320" height="96" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <rect x="252" y="156" width="48" height="16" rx="4" fill="none" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
        <text x="276" y="168" fill="#374151" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">TABLE</text>
        <text x="400" y="196" fill="#111827" font-family="'Figtree', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Routing table lookup</text>
        <text x="400" y="220" fill="#6B7280" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">14 pinned routes</text>

        <!-- Self-delegation guard -->
        <polygon points="400,288 560,376 400,464 240,376" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <text x="400" y="368" fill="#111827" font-family="'Figtree', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Self-delegation guard</text>
        <text x="400" y="392" fill="#6B7280" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">Executor == current driver?</text>

        <!-- Corrective reroute -->
        <rect x="616" y="320" width="160" height="120" rx="8" fill="rgba(17,24,39,0.02)" stroke="rgba(17,24,39,0.28)" stroke-width="1.2" stroke-dasharray="4 4"/>
        <rect x="628" y="332" width="64" height="16" rx="4" fill="none" stroke="rgba(17,24,39,0.28)" stroke-width="0.8"/>
        <text x="660" y="344" fill="#6B7280" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">REROUTE</text>
        <text x="696" y="372" fill="#111827" font-family="'Figtree', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
          <tspan x="696" dy="0">Reroute to next-best</tspan>
          <tspan x="696" dy="16">executor</tspan>
        </text>
        <text x="696" y="416" fill="#6B7280" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">
          <tspan x="696" dy="0">different model,</tspan>
          <tspan x="696" dy="12">not the same call</tspan>
        </text>

        <!-- Merge -->
        <circle cx="400" cy="616" r="4" fill="#111827"/>

        <!-- Sandboxed command -->
        <rect x="240" y="664" width="320" height="96" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
        <rect x="252" y="676" width="40" height="16" rx="4" fill="none" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
        <text x="272" y="688" fill="#374151" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.08em" text-anchor="middle">EXEC</text>
        <text x="400" y="716" fill="#111827" font-family="'Figtree', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Build sandboxed command</text>
        <text x="400" y="740" fill="#6B7280" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle">read · write · web ceiling</text>

        <!-- Focal payoff -->
        <ellipse cx="400" cy="856" rx="140" ry="40" fill="rgba(192,97,74,0.10)" stroke="#A5523D" stroke-width="1.2"/>
        <text x="400" y="860" fill="#A5523D" font-family="'Figtree', system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Executor invoked</text>
      </svg>
