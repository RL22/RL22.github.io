<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extend the router: schema + fallback</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F5EFE6;
      --ink: #111827;
      --muted: #374151;
      --soft: #6B7280;
      --rule: rgba(17, 24, 39, 0.12);
      --accent: #A5523D;
      --accent-tint: rgba(192, 97, 74, 0.10);
      --sans: 'Figtree', system-ui, sans-serif;
      --display: 'Bricolage Grotesque', system-ui, sans-serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }

    body {
      min-height: 100vh;
      padding: 48px 32px 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }

    .frame { width: min(100%, 800px); margin: 0 auto; }
    header { margin-bottom: 24px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font-family: var(--display);
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.08;
    }
    .subtitle { color: var(--muted); font-size: 16px; line-height: 1.5; }
    .diagram { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 640px; height: auto; }
    footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      color: var(--soft);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <p class="eyebrow">Flowchart · delegate.sh</p>
      <h1>Extend the router: schema + fallback</h1>
      <p class="subtitle">Parallel drafts, three gates, one path to merge.</p>
    </header>

    <div class="diagram">
      <svg viewBox="0 0 800 1240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="router-schema-fallback-title router-schema-fallback-desc">
        <title id="router-schema-fallback-title">Extend the router: schema + fallback</title>
        <desc id="router-schema-fallback-desc">Flowchart showing parallel schema and fallback-policy drafts rejoining for static verification, adversarial review, and human approval before installation, with failed gates returning to the merge point.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#374151"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#A5523D"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
            <polygon points="0 0, 8 4, 0 8" fill="#8A4433"/>
          </marker>
        </defs>

        <rect width="800" height="1240" fill="#F5EFE6"/>

        <!-- Arrows: paths and their labels are painted before all nodes. -->
        <g fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)">
          <!-- 1. START → Context Extraction -->
          <path d="M400 104 V148"/>

          <!-- 2. Context Extraction → Schema Draft -->
          <path d="M360 228 V248 Q360 256 352 256 H208 Q200 256 200 264 V288"/>

          <!-- 3. Context Extraction → Fallback Policy Draft -->
          <path d="M440 228 V248 Q440 256 448 256 H592 Q600 256 600 264 V288"/>

          <!-- 4. Schema Draft → merge dot -->
          <path d="M320 344 H368 Q376 344 376 352 V432 Q376 440 384 440 H396" marker-end="none"/>

          <!-- 5. Fallback Policy Draft → merge dot -->
          <path d="M480 344 H432 Q424 344 424 352 V432 Q424 440 416 440 H404" marker-end="none"/>

          <!-- 6. merge dot → Tier 0 verification -->
          <path d="M400 444 V508"/>
        </g>

        <!-- 7. Tier 0 verification → merge dot: separate left retry lane. -->
        <path d="M316 592 H56 Q48 592 48 584 V428 Q48 420 56 420 H368 A8 8 0 0 1 384 420 H392 Q400 420 400 428 V436"
              fill="none" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 4"/>
        <rect x="72" y="400" width="296" height="12" rx="4" fill="#F5EFE6"/>
        <text x="220" y="408" fill="#6B7280" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.04em">NO — RETRY (ESCALATE TIER 3 AFTER 2×)</text>

        <!-- 8. Tier 0 verification → Adversarial skeptic -->
        <path d="M428 616 V672 Q428 680 420 680 H408 Q400 680 400 688 V712"
              fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="436" y="648" width="32" height="12" rx="4" fill="#F5EFE6"/>
        <text x="452" y="656" fill="#374151" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">YES</text>

        <!-- 9. Adversarial skeptic → merge dot: separate right retry lane. -->
        <path d="M484 796 H744 Q752 796 752 788 V484 Q752 476 744 476 H428 Q420 476 420 468 V444 Q420 436 412 436 H404"
              fill="none" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 4"/>
        <rect x="520" y="456" width="112" height="12" rx="4" fill="#F5EFE6"/>
        <text x="576" y="464" fill="#6B7280" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.04em">NO — REVISE</text>

        <!-- 10. Adversarial skeptic → Human approval gate -->
        <path d="M316 796 V872 Q316 880 324 880 H392 Q400 880 400 888 V916"
              fill="none" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="332" y="860" width="32" height="12" rx="4" fill="#F5EFE6"/>
        <text x="348" y="868" fill="#374151" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">YES</text>

        <!-- 11. Human approval gate → merge dot: outer left rejection lane. -->
        <path d="M316 1000 H32 Q24 1000 24 992 V508 Q24 500 32 500 H40 A8 8 0 0 1 56 500 H376 Q384 500 384 492 V452 Q384 444 392 444 H400"
              fill="none" stroke="#6B7280" stroke-width="1.2" stroke-dasharray="4 4"/>
        <rect x="80" y="480" width="176" height="12" rx="4" fill="#F5EFE6"/>
        <text x="168" y="488" fill="#6B7280" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.04em">NO — REJECT + FEEDBACK</text>

        <!-- 12. Human approval gate → END (the final happy-path accent). -->
        <path d="M484 1000 V1096 Q484 1104 476 1104 H408 Q400 1104 400 1112 V1148"
              fill="none" stroke="#A5523D" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="432" y="1084" width="32" height="12" rx="4" fill="#F5EFE6"/>
        <text x="448" y="1092" fill="#A5523D" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing="0.08em">YES</text>

        <!-- Nodes -->
        <g font-family="'Figtree', sans-serif" text-anchor="middle">
          <!-- START -->
          <rect x="280" y="40" width="240" height="64" rx="20" fill="#F5EFE6"/>
          <rect x="280" y="40" width="240" height="64" rx="20" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="400" y="76" fill="#111827" font-size="12" font-weight="600">Change requested</text>

          <!-- Context Extraction -->
          <rect x="280" y="148" width="240" height="80" rx="6" fill="#F5EFE6"/>
          <rect x="280" y="148" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <rect x="292" y="160" width="52" height="16" rx="4" fill="none" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
          <text x="318" y="172" fill="#374151" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em">TIER 1</text>
          <text x="400" y="200" fill="#111827" font-size="12" font-weight="600">Context Extraction</text>

          <!-- Schema Draft -->
          <rect x="80" y="288" width="240" height="88" rx="6" fill="#F5EFE6"/>
          <rect x="80" y="288" width="240" height="88" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <rect x="92" y="300" width="52" height="16" rx="4" fill="none" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
          <text x="118" y="312" fill="#374151" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em">TIER 2</text>
          <text x="200" y="344" fill="#111827" font-size="12" font-weight="600">Schema Draft</text>

          <!-- Fallback Policy Draft -->
          <rect x="480" y="288" width="240" height="88" rx="6" fill="#F5EFE6"/>
          <rect x="480" y="288" width="240" height="88" rx="6" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <rect x="492" y="300" width="52" height="16" rx="4" fill="none" stroke="rgba(17,24,39,0.40)" stroke-width="0.8"/>
          <text x="518" y="312" fill="#374151" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" letter-spacing="0.08em">TIER 2</text>
          <text x="600" y="344" fill="#111827" font-size="12" font-weight="600">Fallback Policy Draft</text>

          <!-- Merge point -->
          <circle cx="400" cy="440" r="4" fill="#111827"/>

          <!-- Tier 0 verification -->
          <polygon points="400 508, 540 568, 400 628, 260 568" fill="#F5EFE6"/>
          <polygon points="400 508, 540 568, 400 628, 260 568" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="400" y="560" fill="#111827" font-size="12" font-weight="600">Tier 0 verification</text>
          <text x="400" y="580" fill="#6B7280" font-size="12">Static checks pass?</text>

          <!-- Adversarial skeptic -->
          <polygon points="400 712, 540 772, 400 832, 260 772" fill="#F5EFE6"/>
          <polygon points="400 712, 540 772, 400 832, 260 772" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="400" y="764" fill="#111827" font-size="12" font-weight="600">Adversarial skeptic</text>
          <text x="400" y="784" fill="#6B7280" font-size="12">Clean?</text>

          <!-- Human approval gate -->
          <polygon points="400 916, 540 976, 400 1036, 260 976" fill="#F5EFE6"/>
          <polygon points="400 916, 540 976, 400 1036, 260 976" fill="#FFFFFF" stroke="#111827" stroke-width="1.2"/>
          <text x="400" y="968" fill="#111827" font-size="12" font-weight="600">Human approval gate</text>
          <text x="400" y="988" fill="#6B7280" font-size="12">Approved?</text>

          <!-- END: the single accented node. -->
          <rect x="280" y="1148" width="240" height="64" rx="20" fill="#F5EFE6"/>
          <rect x="280" y="1148" width="240" height="64" rx="20" fill="rgba(192,97,74,0.10)" stroke="#A5523D" stroke-width="1.2"/>
          <text x="400" y="1184" fill="#A5523D" font-size="12" font-weight="600">Installed</text>
        </g>
      </svg>
    </div>

    <footer>Routing workflow · normalized response schema + per-task fallback policy</footer>
  </main>
</body>
</html>
